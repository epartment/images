name: Docker Image Nginx
on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images (ignore digest check)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 11 * * 0'
  push:
    paths:
      - .trigger
      - nginx/**
      - .github/workflows/*nginx*

jobs:
  discover-versions:
    name: Discover Nginx Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      build_needed: ${{ steps.discover.outputs.build_needed }}
    steps:
      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Login to GHCR (for digest check)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Discover Nginx versions
        id: discover
        run: |
          FORCE_REBUILD="${{ inputs.force_rebuild }}"
          GHCR_BASE="ghcr.io/${{ github.repository_owner }}/nginx"

          # Discover bare major.minor tags >= 1.24
          VERSIONS=$(crane ls nginx 2>/dev/null \
            | grep -E '^[0-9]+\.[0-9]+$' \
            | awk -F'.' '$1 > 1 || ($1 == 1 && $2 >= 24)' \
            | sort -V)

          echo "Discovered Nginx versions: $VERSIONS"

          MATRIX='{"include":['
          FIRST=true
          for VERSION in $VERSIONS; do
            NEEDS_BUILD=false
            if [ "$FORCE_REBUILD" = "true" ]; then
              NEEDS_BUILD=true
              echo "🔄 Nginx ${VERSION}: Force rebuild"
            else
              UPSTREAM_DIGEST=$(crane digest "nginx:${VERSION}" 2>/dev/null || echo "")
              GHCR_DIGEST=$(crane digest "${GHCR_BASE}:${VERSION}" 2>/dev/null || echo "")

              if [ -z "$GHCR_DIGEST" ]; then
                NEEDS_BUILD=true
                echo "🆕 Nginx ${VERSION}: Not yet on GHCR"
              elif [ -z "$UPSTREAM_DIGEST" ]; then
                echo "⚠️  Nginx ${VERSION}: Could not get upstream digest, skipping"
                continue
              elif [ "$UPSTREAM_DIGEST" != "$GHCR_DIGEST" ]; then
                NEEDS_BUILD=true
                echo "🔄 Nginx ${VERSION}: Digest changed"
              else
                echo "✅ Nginx ${VERSION}: Up to date"
              fi
            fi

            if [ "$NEEDS_BUILD" = "true" ]; then
              [ "$FIRST" = true ] && FIRST=false || MATRIX+=','
              MATRIX+="{\"version\":\"${VERSION}\"}"
            fi
          done
          MATRIX+=']}'

          echo "Matrix: $MATRIX"

          if [ "$MATRIX" = '{"include":[]}' ]; then
            echo "build_needed=false" >> $GITHUB_OUTPUT
          else
            echo "build_needed=true" >> $GITHUB_OUTPUT
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  nginx:
    name: Nginx ${{ matrix.version }}
    needs: discover-versions
    if: needs.discover-versions.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ !env.ACT }}

      - uses: docker/build-push-action@v6
        with:
          context: nginx
          platforms: linux/amd64,linux/arm64
          build-args: NGINX_VERSION=${{ matrix.version }}
          push: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
          tags: ghcr.io/${{ github.repository_owner }}/nginx:${{ matrix.version }}
        if: ${{ !env.ACT && github.ref == 'refs/heads/master'}}
