name: Docker Image Valkey
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Versions to build (comma-separated). Empty = auto-discover.'
        required: false
        type: string
  schedule:
    - cron: "0 6 * * *" # 6 AM Daily
  push:
    paths:
      - .trigger
      - valkey/**
      - .github/workflows/*valkey*
    branches:
      - master

jobs:
  # Discover which versions to build: the pinned list is always built and any
  # upstream version newer than the highest pinned one is added automatically.
  # Edit PIN to curate, DENY to exclude, MIN for the floor. See README.
  #
  # Unlike redis, two extra rules apply:
  # - valkey/valkey publishes a `<major>.<minor>` tag while that minor is still a release
  #   candidate (`9.2` in Nov 2026), so a discovered minor only counts
  #   once a `<major>.<minor>.<patch>` tag without a suffix exists.
  # - The newest selected minor of each major is also published as `:<major>` (`valkey:9`), but
  #   only when discovery listed released versions. A manual `versions` run, or a run whose tag
  #   listing failed and fell back to PIN, publishes only the exact tags, so `:<major>` never
  #   moves back to an older minor.
  discover:
    name: Discover Valkey versions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      build: ${{ steps.discover.outputs.build }}
    steps:
      - name: Discover versions
        id: discover
        run: |
          set -uo pipefail
          UPSTREAM="valkey/valkey"
          MIN="8.0"                       # floor — ignore anything older
          PIN="8.0 8.1 9.0"               # always built + fallback if discovery fails
          DENY=""                         # never build these
          OVERRIDE="${{ inputs.versions }}"

          MAXPIN=$(printf '%s\n' $PIN | sort -V | tail -1)
          ALIASES="false"
          if [ -n "${OVERRIDE}" ]; then
            CAND=$(echo "$OVERRIDE" | tr ', ' '\n' | grep -v '^$' || true)
          else
            TAGS=$(docker run --rm gcr.io/go-containerregistry/crane ls "$UPSTREAM" 2>/dev/null || true)
            # A minor is released once a plain <major>.<minor>.<patch> tag exists.
            DISCOVERED=$(echo "$TAGS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed -E 's/\.[0-9]+$//' | sort -uV | paste -sd' ' - || true)
            if [ -n "$DISCOVERED" ]; then
              ALIASES="true"
            else
              echo "::warning::Tag listing for ${UPSTREAM} failed; building PIN without moving the :<major> aliases."
            fi
            NEWER=""
            for v in $DISCOVERED; do
              [ "$v" = "$MAXPIN" ] && continue
              [ "$(printf '%s\n%s\n' "$MAXPIN" "$v" | sort -V | tail -1)" = "$v" ] && NEWER="$NEWER $v"
            done
            CAND="$PIN $NEWER"
          fi

          SEL=""
          for v in $CAND; do
            case " $DENY " in *" $v "*) continue ;; esac
            [ "$(printf '%s\n%s\n' "$MIN" "$v" | sort -V | head -n1)" = "$MIN" ] || continue
            SEL="$SEL $v"
          done
          SEL=$(printf '%s\n' $SEL | grep -v '^$' | sort -uV || true)
          echo "Selected Valkey versions: $(echo $SEL | paste -sd' ' -)"

          if [ -z "$(echo $SEL | tr -d '[:space:]')" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            # major_tag is set on the newest selected minor of each major (SEL is sorted
            # ascending, so the last one per major wins), and left empty when ALIASES is false.
            MATRIX=$(printf '%s\n' $SEL | jq -R . | jq -cs --arg aliases "$ALIASES" '
              . as $all
              | {include: map(. as $v | ($v | split(".")[0]) as $major | {
                  version: $v,
                  major_tag: (if $aliases == "true"
                                 and $v == ($all | map(select(split(".")[0] == $major)) | last)
                              then $major else "" end)
                })}')
            echo "Matrix: $MATRIX"
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  valkey:
    name: Valkey ${{ matrix.version }}
    needs: discover
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - uses: docker/build-push-action@v6
        with:
          context: valkey
          platforms: linux/amd64,linux/arm64
          build-args: VALKEY_VERSION=${{ matrix.version }}
          push: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
          # An empty line (no major tag for this version) is ignored by build-push-action.
          tags: |
            ghcr.io/${{ github.repository_owner }}/roll/valkey:${{ matrix.version }}
            ${{ matrix.major_tag != '' && format('ghcr.io/{0}/roll/valkey:{1}', github.repository_owner, matrix.major_tag) || '' }}
        if: ${{ !env.ACT }}
