name: Docker Image PHP-FPM
on:
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions to build (comma-separated). Leave empty to auto-discover from the registry.'
        required: false
        type: string
      node_versions:
        description: 'Node versions to build (comma-separated). Leave empty to auto-discover from the registry.'
        required: false
        type: string
  schedule:
    - cron: "0 6 * * *"   # 6 AM daily
  pull_request:
  push:
    paths:
      - .trigger
      - php-fpm/**
      - .github/workflows/*php-fpm*
      - .github/workflows/php-matrix/**
    branches:
      - master

env:
  REGISTRY_IMAGE: ghcr.io/epartment/roll/php-fpm
  REGISTRY_XDEBUG: ghcr.io/epartment/roll/php-fpm-debug
  REGISTRY_MAGENTO1: ghcr.io/epartment/roll/php-fpm-magento1
  REGISTRY_MAGENTO2: ghcr.io/epartment/roll/php-fpm-magento2
  REGISTRY_MAGENTO2_DEBUG: ghcr.io/epartment/roll/php-fpm-magento2-debug
  REGISTRY_WORDPRESS: ghcr.io/epartment/roll/php-fpm-wordpress

jobs:
  # ---------------------------------------------------------------------------
  # Discover which PHP / Node versions to build by listing the upstream tags
  # with crane, then hand them to the matrix generators. Floor, deny-list and
  # pinned fallbacks live in php-matrix/constants.php — this job only supplies
  # the raw discovered lists (the generators apply the policy). If discovery
  # returns nothing (registry hiccup) the generators fall back to the pinned
  # lists, so the build never stalls for lack of a version list.
  # ---------------------------------------------------------------------------
  discover:
    name: Discover PHP & Node versions
    runs-on: ubuntu-latest
    outputs:
      php_versions: ${{ steps.discover.outputs.php_versions }}
      node_versions: ${{ steps.discover.outputs.node_versions }}
      registry_base: ${{ steps.discover.outputs.registry_base }}
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - name: Login to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Discover versions
        id: discover
        run: |
          set -uo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          MIRROR="ghcr.io/${OWNER}/base-images"

          # Prefer the GHCR mirror of the base images (insulated from Docker Hub
          # rate limits); fall back to Docker Hub when the mirror is absent.
          if crane ls "${MIRROR}/php" >/dev/null 2>&1; then
            REGISTRY_BASE="${MIRROR}"; PHP_SRC="${MIRROR}/php"; NODE_SRC="${MIRROR}/node"
            echo "Using mirrored base images: ${MIRROR}"
          else
            REGISTRY_BASE=""; PHP_SRC="php"; NODE_SRC="node"
            echo "Mirror not found; using Docker Hub base images"
          fi
          echo "registry_base=${REGISTRY_BASE}" >> "$GITHUB_OUTPUT"

          # Manual override via workflow_dispatch wins over discovery.
          PHP_IN="${{ inputs.php_versions }}"
          NODE_IN="${{ inputs.node_versions }}"

          if [ -n "${PHP_IN}" ]; then
            PHP_VERSIONS="${PHP_IN}"
          else
            # major.minor -fpm- (bullseye|bookworm) tags only; patch tags ignored.
            PHP_VERSIONS=$(crane ls "${PHP_SRC}" 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+-fpm-(bullseye|bookworm)$' \
              | sed 's/-fpm-.*//' | sort -uV | paste -sd, -)
          fi
          if [ -n "${NODE_IN}" ]; then
            NODE_VERSIONS="${NODE_IN}"
          else
            NODE_VERSIONS=$(crane ls "${NODE_SRC}" 2>/dev/null \
              | grep -E '^[0-9]+-(bullseye|bookworm)$' \
              | sed 's/-.*//' | sort -un | paste -sd, -)
          fi

          echo "php_versions=${PHP_VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "node_versions=${NODE_VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "Discovered PHP: ${PHP_VERSIONS:-<none — generators use pinned fallback>}"
          echo "Discovered Node: ${NODE_VERSIONS:-<none — generators use pinned fallback>}"

  php-matrix:
    name: Generate Base PHP Matrix
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - id: matrix
        env:
          DISCOVERED_PHP_VERSIONS: ${{ needs.discover.outputs.php_versions }}
          DISCOVERED_NODE_VERSIONS: ${{ needs.discover.outputs.node_versions }}
        run: |
          php .github/workflows/php-matrix/php-generator.php >> $GITHUB_OUTPUT
      - run: echo "Matrix:\n";echo '${{ steps.matrix.outputs.matrix }}'
  node-matrix:
    name: Generate Base PHP-Node Matrix
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - id: matrix
        env:
          DISCOVERED_PHP_VERSIONS: ${{ needs.discover.outputs.php_versions }}
          DISCOVERED_NODE_VERSIONS: ${{ needs.discover.outputs.node_versions }}
        run: |
          php .github/workflows/php-matrix/node-generator.php >> $GITHUB_OUTPUT
      - run: echo "Matrix:\n";echo '${{ steps.matrix.outputs.matrix }}'
  full-matrix:
    name: Generate Full Matrix
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - id: matrix
        env:
          DISCOVERED_PHP_VERSIONS: ${{ needs.discover.outputs.php_versions }}
          DISCOVERED_NODE_VERSIONS: ${{ needs.discover.outputs.node_versions }}
        run: |
          php .github/workflows/php-matrix/full-generator.php >> $GITHUB_OUTPUT
      - run: echo "Matrix:\n";echo '${{ steps.matrix.outputs.matrix }}'

  php-fpm-build:
    needs: [ discover, php-matrix ]
    name: PHP-FPM ${{ matrix.php_version }} (${{ matrix.arch.cache_arch }})
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.php-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6

      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            OS_RELEASE=${{ matrix.php_os_release }}
            ENV_SOURCE_IMAGE=${{ needs.discover.outputs.registry_base != '' && format('{0}/php', needs.discover.outputs.registry_base) || 'php' }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

      - name: Export digest
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}-${{ matrix.php_version }}"

      - name: Upload digest
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1


  php-node:
    name: PHP-FPM ${{ matrix.php_version }} + Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.arch.runs_on }}
    needs: [ php-fpm-build, node-matrix ]
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/master' && 6 || 0 }}
      matrix: ${{fromJson(needs.node-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6
      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          file: php-fpm/node/Dockerfile
          context: php-fpm/context
          platforms: linux/amd64,linux/arm64
          build-args: |
            ENV_SOURCE_IMAGE=ghcr.io/${{ github.repository_owner }}/roll/php-fpm
            PHP_VERSION=${{ matrix.php_version }}
            NODE_VERSION=${{ matrix.node_version }}
            OS_RELEASE=${{ matrix.node_os_release }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

      - name: Export digest
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}-${{ matrix.php_version }}-node${{ matrix.node_version }}"

      - name: Upload digest
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  xdebug:
    needs: [ php-node, full-matrix ]
    name: PHP-FPM ${{ matrix.php_version }} + XDebug - Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/master' && 2 || 0 }}
      matrix: ${{fromJson(needs.full-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6
      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/xdebug3/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            ENV_SOURCE_IMAGE=ghcr.io/${{ github.repository_owner }}/roll/php-fpm
            PHP_VERSION=${{ matrix.php_version }}-node${{ matrix.node_version }}
            XDEBUG_TYPE=${{ matrix.xdebug_type }}
          tags: ${{ env.REGISTRY_XDEBUG }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-debug:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-debug:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

      - name: Export digest
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        run: |
          mkdir -p ${{ runner.temp }}/xdebug-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/xdebug-digests/${digest#sha256:}-${{ matrix.php_version }}-node${{ matrix.node_version }}"

      - name: Upload digest
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: xdebug-digests-${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}
          path: ${{ runner.temp }}/xdebug-digests/*
          if-no-files-found: error
          retention-days: 1

  magento1:
