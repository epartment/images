name: Docker Image PHP-FPM
on:
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions to build (comma-separated). Leave empty to auto-discover from the registry.'
        required: false
        type: string
      node_versions:
        description: 'Node versions to build (comma-separated). Leave empty to auto-discover from the registry.'
        required: false
        type: string
  schedule:
    - cron: "0 6 * * *"   # 6 AM daily
  push:
    paths:
      - .trigger
      - php-fpm/**
      - .github/workflows/*php-fpm*
      - .github/workflows/php-matrix/**
      - .github/scripts/merge-per-arch-tags.sh
    branches:
      - master

env:
  REGISTRY_IMAGE: ghcr.io/epartment/roll/php-fpm
  REGISTRY_XDEBUG: ghcr.io/epartment/roll/php-fpm-debug
  REGISTRY_MAGENTO1: ghcr.io/epartment/roll/php-fpm-magento1
  REGISTRY_MAGENTO2: ghcr.io/epartment/roll/php-fpm-magento2
  REGISTRY_MAGENTO2_DEBUG: ghcr.io/epartment/roll/php-fpm-magento2-debug
  REGISTRY_WORDPRESS: ghcr.io/epartment/roll/php-fpm-wordpress
  # Every build leg pushes <image>:<version>-arch-<suffix> with this label set to
  # the run id; the merge jobs publish a version only when all its arch tags carry
  # this run's id (see .github/scripts/merge-per-arch-tags.sh).
  PER_ARCH_RUN_LABEL: org.epartment.roll.ci-run-id

# Runs share the per-arch hand-off tags, so two overlapping runs could leave x86
# and arm64 labelled with different run ids and both merges would skip the version.
# Queue runs instead of overlapping them; never cancel a build in progress. The
# group includes the ref so a no-op run from another branch cannot displace a
# queued master run (GitHub keeps one pending run per group; a newer one replaces it).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Discover which PHP / Node versions to build by listing the upstream tags
  # with crane, then hand them to the matrix generators. Floor, deny-list and
  # pinned fallbacks live in php-matrix/constants.php — this job only supplies
  # the raw discovered lists (the generators apply the policy). If discovery
  # returns nothing (registry hiccup) the generators fall back to the pinned
  # lists, so the build never stalls for lack of a version list.
  # ---------------------------------------------------------------------------
  discover:
    name: Discover PHP & Node versions
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    outputs:
      php_versions: ${{ steps.discover.outputs.php_versions }}
      node_versions: ${{ steps.discover.outputs.node_versions }}
      registry_base: ${{ steps.discover.outputs.registry_base }}
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - name: Login to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Discover versions
        id: discover
        run: |
          set -uo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          MIRROR="ghcr.io/${OWNER}/base-images"
          # Keep in sync with PHP_MIN_VERSION in php-matrix/constants.php — the
          # mirror must carry every PHP version php-fpm might build (down to this
          # floor) or it can't safely serve as the build base.
          PHP_FLOOR="7.3"

          # Keep only versions >= PHP_FLOOR (uses `if`, so a non-match can't trip
          # the runner's `set -e`).
          above_floor() {
            while read -r v; do
              [ -n "$v" ] || continue
              if [ "$(printf '%s\n%s\n' "$PHP_FLOOR" "$v" | sort -V | head -n1)" = "$PHP_FLOOR" ]; then
                echo "$v"
              fi
            done
          }

          # Discover from Docker Hub. This is a single cheap tag listing; the
          # rate-limit-sensitive part is the per-arch BUILD pulls, which use the
          # mirror when it is complete (decided below).
          DH_PHP_MM=$(crane ls php 2>/dev/null \
            | grep -E '^[0-9]+\.[0-9]+-fpm-(bullseye|bookworm)$' \
            | sed 's/-fpm-.*//' | sort -uV | above_floor || true)
          DH_NODE_MM=$(crane ls node 2>/dev/null \
            | grep -E '^[0-9]+-(bullseye|bookworm)$' | sed 's/-.*//' | sort -un || true)

          # Manual override via workflow_dispatch wins over discovery.
          PHP_IN="${{ inputs.php_versions }}"
          NODE_IN="${{ inputs.node_versions }}"
          if [ -n "${PHP_IN}" ]; then PHP_VERSIONS="${PHP_IN}"; else PHP_VERSIONS=$(echo "$DH_PHP_MM" | paste -sd, - || true); fi
          if [ -n "${NODE_IN}" ]; then NODE_VERSIONS="${NODE_IN}"; else NODE_VERSIONS=$(echo "$DH_NODE_MM" | paste -sd, - || true); fi

          # Use the mirror as the php build base ONLY when it already contains
          # every PHP major.minor Docker Hub offers above the floor. "Repo exists"
          # is not enough: a partially-populated mirror (e.g. a previous run
          # failed mid-way) would make some builds pull a missing base and fail.
          REGISTRY_BASE=""
          if crane ls "${MIRROR}/php" >/dev/null 2>&1; then
            MIRROR_PHP_MM=$(crane ls "${MIRROR}/php" 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+-fpm-(bullseye|bookworm)$' \
              | sed 's/-fpm-.*//' | sort -uV || true)
            MISSING=$(comm -23 <(printf '%s\n' $DH_PHP_MM | sort -u) <(printf '%s\n' $MIRROR_PHP_MM | sort -u))
            if [ -z "$(echo $MISSING | tr -d '[:space:]')" ] && [ -n "$(echo $DH_PHP_MM | tr -d '[:space:]')" ]; then
              REGISTRY_BASE="${MIRROR}"
              echo "Mirror is complete; using ${MIRROR} as the php build base."
            else
              echo "Mirror incomplete (missing: $(echo $MISSING | paste -sd' ' -)); using Docker Hub as the php build base."
            fi
          else
            echo "Mirror not present; using Docker Hub as the php build base."
          fi

          echo "registry_base=${REGISTRY_BASE}" >> "$GITHUB_OUTPUT"
          echo "php_versions=${PHP_VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "node_versions=${NODE_VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "Discovered PHP: ${PHP_VERSIONS:-<none — generators use pinned fallback>}"
          echo "Discovered Node: ${NODE_VERSIONS:-<none — generators use pinned fallback>}"

  php-matrix:
    name: Generate Base PHP Matrix
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - id: matrix
        env:
          DISCOVERED_PHP_VERSIONS: ${{ needs.discover.outputs.php_versions }}
          DISCOVERED_NODE_VERSIONS: ${{ needs.discover.outputs.node_versions }}
          # A manual workflow_dispatch list REPLACES the resolved set rather than
          # adding to it, so a targeted rebuild really is a two-job run.
          OVERRIDE_PHP_VERSIONS: ${{ inputs.php_versions }}
          OVERRIDE_NODE_VERSIONS: ${{ inputs.node_versions }}
        run: |
          php .github/workflows/php-matrix/php-generator.php >> $GITHUB_OUTPUT
      - run: echo "Matrix:\n";echo '${{ steps.matrix.outputs.matrix }}'
  node-matrix:
    name: Generate Base PHP-Node Matrix
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - id: matrix
        env:
          DISCOVERED_PHP_VERSIONS: ${{ needs.discover.outputs.php_versions }}
          DISCOVERED_NODE_VERSIONS: ${{ needs.discover.outputs.node_versions }}
          # A manual workflow_dispatch list REPLACES the resolved set rather than
          # adding to it, so a targeted rebuild really is a two-job run.
          OVERRIDE_PHP_VERSIONS: ${{ inputs.php_versions }}
          OVERRIDE_NODE_VERSIONS: ${{ inputs.node_versions }}
        run: |
          php .github/workflows/php-matrix/node-generator.php >> $GITHUB_OUTPUT
      - run: echo "Matrix:\n";echo '${{ steps.matrix.outputs.matrix }}'
  full-matrix:
    name: Generate Full Matrix
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - id: matrix
        env:
          DISCOVERED_PHP_VERSIONS: ${{ needs.discover.outputs.php_versions }}
          DISCOVERED_NODE_VERSIONS: ${{ needs.discover.outputs.node_versions }}
          # A manual workflow_dispatch list REPLACES the resolved set rather than
          # adding to it, so a targeted rebuild really is a two-job run.
          OVERRIDE_PHP_VERSIONS: ${{ inputs.php_versions }}
          OVERRIDE_NODE_VERSIONS: ${{ inputs.node_versions }}
        run: |
          php .github/workflows/php-matrix/full-generator.php >> $GITHUB_OUTPUT
      - run: echo "Matrix:\n";echo '${{ steps.matrix.outputs.matrix }}'

  php-fpm-build:
    needs: [ discover, php-matrix ]
    name: PHP-FPM ${{ matrix.php_version }} (${{ matrix.arch.cache_arch }})
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.php-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6

      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch tag (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            OS_RELEASE=${{ matrix.php_os_release }}
            ENV_SOURCE_IMAGE=${{ needs.discover.outputs.registry_base != '' && format('{0}/php', needs.discover.outputs.registry_base) || 'php' }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ matrix.php_version }}-arch-${{ matrix.arch.cache_suffix }}
          labels: ${{ env.PER_ARCH_RUN_LABEL }}=${{ github.run_id }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

  php-node:
    name: PHP-FPM ${{ matrix.php_version }} + Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.arch.runs_on }}
    needs: [ php-fpm-build, node-matrix ]
    # Run even when some entries of the previous layer failed, so the combinations that did
    # build still continue down the chain. Without this a single failing PHP version skips
    # every job in this layer (plain `needs:` skips on ANY failure in the needed job).
    # Gated on the matrix generator itself succeeding, since `fromJson` needs its output.
    if: ${{ !cancelled() && needs.node-matrix.result == 'success' }}
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/master' && 6 || 0 }}
      matrix: ${{fromJson(needs.node-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6
      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Build and push per-arch tag (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/node/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            ENV_SOURCE_IMAGE=ghcr.io/${{ github.repository_owner }}/roll/php-fpm
            PHP_VERSION=${{ matrix.php_version }}
            NODE_VERSION=${{ matrix.node_version }}
            OS_RELEASE=${{ matrix.node_os_release }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ matrix.php_version }}-node${{ matrix.node_version }}-arch-${{ matrix.arch.cache_suffix }}
          labels: ${{ env.PER_ARCH_RUN_LABEL }}=${{ github.run_id }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

  xdebug:
    needs: [ php-node, full-matrix ]
    # Run even when some entries of the previous layer failed, so the combinations that did
    # build still continue down the chain. Without this a single failing PHP version skips
    # every job in this layer (plain `needs:` skips on ANY failure in the needed job).
    # Gated on the matrix generator itself succeeding, since `fromJson` needs its output.
    if: ${{ !cancelled() && needs.full-matrix.result == 'success' }}
    name: PHP-FPM ${{ matrix.php_version }} + XDebug - Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/master' && 2 || 0 }}
      matrix: ${{fromJson(needs.full-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6
      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch tag (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/xdebug3/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            ENV_SOURCE_IMAGE=ghcr.io/${{ github.repository_owner }}/roll/php-fpm
            PHP_VERSION=${{ matrix.php_version }}-node${{ matrix.node_version }}
            XDEBUG_TYPE=${{ matrix.xdebug_type }}
          tags: ${{ env.REGISTRY_XDEBUG }}:${{ matrix.php_version }}-node${{ matrix.node_version }}-arch-${{ matrix.arch.cache_suffix }}
          labels: ${{ env.PER_ARCH_RUN_LABEL }}=${{ github.run_id }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-debug:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-debug:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

  magento1:
    needs: [ full-matrix, php-node ]
    # Run even when some entries of the previous layer failed, so the combinations that did
    # build still continue down the chain. Without this a single failing PHP version skips
    # every job in this layer (plain `needs:` skips on ANY failure in the needed job).
    # Gated on the matrix generator itself succeeding, since `fromJson` needs its output.
    if: ${{ !cancelled() && needs.full-matrix.result == 'success' }}
    name: Magento 1 PHP-FPM ${{ matrix.php_version }} - Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/master' && 2 || 0 }}
      matrix: ${{fromJson(needs.full-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6
      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch tag (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/magento1/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            ENV_SOURCE_IMAGE=ghcr.io/${{ github.repository_owner }}/roll/php-fpm
            PHP_VERSION=${{ matrix.php_version }}-node${{ matrix.node_version }}
          tags: ${{ env.REGISTRY_MAGENTO1 }}:${{ matrix.php_version }}-node${{ matrix.node_version }}-arch-${{ matrix.arch.cache_suffix }}
          labels: ${{ env.PER_ARCH_RUN_LABEL }}=${{ github.run_id }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-magento1:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-magento1:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

  magento2:
    needs: [ full-matrix, php-node ]
    # Run even when some entries of the previous layer failed, so the combinations that did
    # build still continue down the chain. Without this a single failing PHP version skips
    # every job in this layer (plain `needs:` skips on ANY failure in the needed job).
    # Gated on the matrix generator itself succeeding, since `fromJson` needs its output.
    if: ${{ !cancelled() && needs.full-matrix.result == 'success' }}
    name: Magento 2 PHP-FPM ${{ matrix.php_version }} - Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/master' && 2 || 0 }}
      matrix: ${{fromJson(needs.full-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6
      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch tag (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/magento2/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            ENV_SOURCE_IMAGE=ghcr.io/${{ github.repository_owner }}/roll/php-fpm
            PHP_VERSION=${{ matrix.php_version }}-node${{ matrix.node_version }}
          tags: ${{ env.REGISTRY_MAGENTO2 }}:${{ matrix.php_version }}-node${{ matrix.node_version }}-arch-${{ matrix.arch.cache_suffix }}
          labels: ${{ env.PER_ARCH_RUN_LABEL }}=${{ github.run_id }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-magento2:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-magento2:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

  magento2-xdebug:
    needs: [ full-matrix, magento2 ]
    # Run even when some entries of the previous layer failed, so the combinations that did
    # build still continue down the chain. Without this a single failing PHP version skips
    # every job in this layer (plain `needs:` skips on ANY failure in the needed job).
    # Gated on the matrix generator itself succeeding, since `fromJson` needs its output.
    if: ${{ !cancelled() && needs.full-matrix.result == 'success' }}
    name: Magento 2 PHP-FPM ${{ matrix.php_version }} + XDebug - Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/master' && 2 || 0 }}
      matrix: ${{fromJson(needs.full-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6
      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch tag (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/magento2/xdebug3/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            ENV_SOURCE_IMAGE=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-magento2
            PHP_VERSION=${{ matrix.php_version }}-node${{ matrix.node_version }}
            XDEBUG_TYPE=${{ matrix.xdebug_type }}
          tags: ${{ env.REGISTRY_MAGENTO2_DEBUG }}:${{ matrix.php_version }}-node${{ matrix.node_version }}-arch-${{ matrix.arch.cache_suffix }}
          labels: ${{ env.PER_ARCH_RUN_LABEL }}=${{ github.run_id }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-magento2-debug:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-magento2-debug:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

  wordpress:
    needs: [ full-matrix, php-node ]
    # Run even when some entries of the previous layer failed, so the combinations that did
    # build still continue down the chain. Without this a single failing PHP version skips
    # every job in this layer (plain `needs:` skips on ANY failure in the needed job).
    # Gated on the matrix generator itself succeeding, since `fromJson` needs its output.
    if: ${{ !cancelled() && needs.full-matrix.result == 'success' }}
    name: Wordpress PHP-FPM ${{ matrix.php_version }} - Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/master' && 2 || 0 }}
      matrix: ${{fromJson(needs.full-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6
      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch tag (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/wordpress/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            ENV_SOURCE_IMAGE=ghcr.io/${{ github.repository_owner }}/roll/php-fpm
            PHP_VERSION=${{ matrix.php_version }}-node${{ matrix.node_version }}
          tags: ${{ env.REGISTRY_WORDPRESS }}:${{ matrix.php_version }}-node${{ matrix.node_version }}-arch-${{ matrix.arch.cache_suffix }}
          labels: ${{ env.PER_ARCH_RUN_LABEL }}=${{ github.run_id }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-wordpress:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-wordpress:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

  merge:
    needs: [ php-matrix, node-matrix, php-fpm-build, php-node ]
    # Run even when some build-matrix entries failed, so the combinations that
    # *did* build are still published. A single flaky build no longer blocks
    # every tag (only `cancelled()` — e.g. a manual cancel — stops the merge).
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests per version
        if: ${{ !env.ACT }}
        env:
          PHP_MATRIX: ${{ needs.php-matrix.outputs.matrix }}
          NODE_MATRIX: ${{ needs.node-matrix.outputs.matrix }}
        run: |
          {
            jq -r '.include[] | "\(.php_version) \(.arch.cache_suffix)"' <<<"$PHP_MATRIX"
            jq -r '.include[] | "\(.php_version)-node\(.node_version) \(.arch.cache_suffix)"' <<<"$NODE_MATRIX"
          } | bash .github/scripts/merge-per-arch-tags.sh "${{ env.REGISTRY_IMAGE }}" "${{ github.run_id }}"

