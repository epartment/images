name: Docker Image PHP-FPM
on:
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions to build (comma-separated). Leave empty to auto-discover from the registry.'
        required: false
        type: string
      node_versions:
        description: 'Node versions to build (comma-separated). Leave empty to auto-discover from the registry.'
        required: false
        type: string
      force:
        description: 'Build every selected image, also when its inputs did not change since it was published.'
        required: false
        type: boolean
        default: true
      no_cache:
        description: 'Build the base images without the registry cache (scheduled runs always do).'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"   # 6 AM daily
  push:
    paths:
      - .trigger
      - php-fpm/**
      - .github/workflows/*php-fpm*
      - .github/workflows/php-matrix/**
      - .github/scripts/**
    branches:
      - master

env:
  # Every build pushes <image>:<version>-arch-<suffix> with this label set to the run id; the
  # merge job publishes a version only when all its arch tags carry this run's id (see
  # .github/scripts/merge-per-arch-tags.sh).
  PER_ARCH_RUN_LABEL: org.epartment.roll.ci-run-id
  # Every build also labels its images with the fingerprint of their inputs; the plan job skips
  # an image whose published label equals the fingerprint it computes for this run.
  FINGERPRINT_LABEL: org.epartment.roll.source-fingerprint

# Runs share the per-arch hand-off tags, so two overlapping runs could leave x86
# and arm64 labelled with different run ids and both merges would skip the version.
# Queue runs instead of overlapping them; never cancel a build in progress. The
# group includes the ref so a no-op run from another branch cannot displace a
# queued master run (GitHub keeps one pending run per group; a newer one replaces it).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Discover which PHP / Node versions to build by listing the upstream tags
  # with crane, then hand them to the plan job's generator. Floor, deny-list and
  # pinned fallbacks live in php-matrix/constants.php — this job only supplies
  # the raw discovered lists (the generator applies the policy). If discovery
  # returns nothing (registry hiccup) the generator falls back to the pinned
  # lists, so the build never stalls for lack of a version list.
  # ---------------------------------------------------------------------------
  discover:
    name: Discover PHP & Node versions
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    outputs:
      php_versions: ${{ steps.discover.outputs.php_versions }}
      node_versions: ${{ steps.discover.outputs.node_versions }}
      registry_base: ${{ steps.discover.outputs.registry_base }}
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - name: Login to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Discover versions
        id: discover
        run: |
          set -uo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          MIRROR="ghcr.io/${OWNER}/base-images"
          # Keep in sync with PHP_MIN_VERSION in php-matrix/constants.php — the
          # mirror must carry every PHP version php-fpm might build (down to this
          # floor) or it can't safely serve as the build base.
          PHP_FLOOR="7.3"

          # Keep only lines whose version (the part before the first "-") is >= PHP_FLOOR
          # (uses `if`, so a non-match can't trip the runner's `set -e`).
          above_floor() {
            while read -r v; do
              [ -n "$v" ] || continue
              if [ "$(printf '%s\n%s\n' "$PHP_FLOOR" "${v%%-*}" | sort -V | head -n1)" = "$PHP_FLOOR" ]; then
                echo "$v"
              fi
            done
          }

          # Discover from Docker Hub. This is a single cheap tag listing; the
          # rate-limit-sensitive part is the per-arch BUILD pulls, which use the
          # mirror when it is complete (decided below).
          DH_PHP_TAGS=$(crane ls php 2>/dev/null \
            | grep -E '^[0-9]+\.[0-9]+-fpm-(bullseye|bookworm)$' \
            | sort -uV | above_floor || true)
          DH_PHP_MM=$(printf '%s\n' $DH_PHP_TAGS | sed 's/-fpm-.*//' | sort -uV)
          DH_NODE_MM=$(crane ls node 2>/dev/null \
            | grep -E '^[0-9]+-(bullseye|bookworm)$' | sed 's/-.*//' | sort -un || true)

          # Manual override via workflow_dispatch wins over discovery.
          PHP_IN="${{ inputs.php_versions }}"
          NODE_IN="${{ inputs.node_versions }}"
          if [ -n "${PHP_IN}" ]; then PHP_VERSIONS="${PHP_IN}"; else PHP_VERSIONS=$(echo "$DH_PHP_MM" | paste -sd, - || true); fi
          if [ -n "${NODE_IN}" ]; then NODE_VERSIONS="${NODE_IN}"; else NODE_VERSIONS=$(echo "$DH_NODE_MM" | paste -sd, - || true); fi

          # Use the mirror as the php build base ONLY when it already contains
          # every PHP base tag (major.minor and Debian release) Docker Hub offers
          # above the floor. "Repo exists" is not enough: a partially-populated
          # mirror (e.g. one tag failed to copy) would make some builds pull a
          # missing base and fail.
          REGISTRY_BASE=""
          if crane ls "${MIRROR}/php" >/dev/null 2>&1; then
            MIRROR_PHP_TAGS=$(crane ls "${MIRROR}/php" 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+-fpm-(bullseye|bookworm)$' || true)
            MISSING=$(comm -23 <(printf '%s\n' $DH_PHP_TAGS | sort -u) <(printf '%s\n' $MIRROR_PHP_TAGS | sort -u))
            if [ -z "$(echo $MISSING | tr -d '[:space:]')" ] && [ -n "$(echo $DH_PHP_MM | tr -d '[:space:]')" ]; then
              REGISTRY_BASE="${MIRROR}"
              echo "Mirror is complete; using ${MIRROR} as the php build base."
            else
              echo "Mirror incomplete (missing: $(echo $MISSING | paste -sd' ' -)); using Docker Hub as the php build base."
            fi
          else
            echo "Mirror not present; using Docker Hub as the php build base."
          fi

          echo "registry_base=${REGISTRY_BASE}" >> "$GITHUB_OUTPUT"
          echo "php_versions=${PHP_VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "node_versions=${NODE_VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "Discovered PHP: ${PHP_VERSIONS:-<none — generators use pinned fallback>}"
          echo "Discovered Node: ${NODE_VERSIONS:-<none — generators use pinned fallback>}"

  # ---------------------------------------------------------------------------
  # Decide what to build. bake-generator.php lists the upstream and published
  # images, collect-registry-state.sh reads their digests and fingerprint labels,
  # and the generator emits the base and variant matrices for the images whose
  # inputs changed. The ISO week is a fingerprint input, so the first run of each
  # week rebuilds everything (scheduled runs without the base cache); a lookup
  # failure counts as changed.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan the builds
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      chunks: ${{ steps.plan.outputs.chunks }}
      expected: ${{ steps.plan.outputs.expected }}
      has_base: ${{ steps.plan.outputs.has_base }}
      has_chunks: ${{ steps.plan.outputs.has_chunks }}
      no_cache: ${{ steps.plan.outputs.no_cache }}
      registry: ${{ steps.plan.outputs.registry }}
      php_source_image: ${{ steps.plan.outputs.php_source_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Plan the builds
        id: plan
        env:
          DISCOVERED_PHP_VERSIONS: ${{ needs.discover.outputs.php_versions }}
          DISCOVERED_NODE_VERSIONS: ${{ needs.discover.outputs.node_versions }}
          # A manual workflow_dispatch list REPLACES the resolved set rather than
          # adding to it, so a targeted rebuild really builds only that set.
          OVERRIDE_PHP_VERSIONS: ${{ inputs.php_versions }}
          OVERRIDE_NODE_VERSIONS: ${{ inputs.node_versions }}
          REGISTRY_BASE: ${{ needs.discover.outputs.registry_base }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          NO_CACHE_INPUT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
        run: |
          set -uo pipefail
          REGISTRY="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/roll"
          PHP_SOURCE_IMAGE="php"
          if [ -n "$REGISTRY_BASE" ]; then PHP_SOURCE_IMAGE="${REGISTRY_BASE}/php"; fi
          TREE_HASH=$(git ls-tree HEAD php-fpm .github/workflows/docker-image-php-fpm.yml \
            .github/workflows/php-matrix .github/scripts .trigger | sha256sum | cut -d' ' -f1)
          BUILD_WEEK=$(date -u +%G-W%V)
          FORCE=0
          if [ "$FORCE_INPUT" = "true" ]; then FORCE=1; fi
          export REGISTRY PHP_SOURCE_IMAGE TREE_HASH BUILD_WEEK FORCE RUN_ID

          generator=.github/workflows/php-matrix/bake-generator.php
          summary="$RUNNER_TEMP/plan-summary.txt"
          if ! php "$generator" refs \
              | .github/scripts/collect-registry-state.sh \
              | php "$generator" matrix 2>"$summary" >>"$GITHUB_OUTPUT"; then
            cat "$summary" >&2
            exit 1
          fi
          {
            echo "no_cache=${NO_CACHE_INPUT}"
            echo "registry=${REGISTRY}"
            echo "php_source_image=${PHP_SOURCE_IMAGE}"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Build plan (week ${BUILD_WEEK}, force=${FORCE}, no_cache=${NO_CACHE_INPUT})"
            echo '```'
            cat "$summary"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$summary"

  # ---------------------------------------------------------------------------
  # One job per PHP version × architecture: the base image and the tools image
  # (mydumper + Xdebug module), pushed as per-arch tags labelled with this run's
  # id and the base fingerprint. Each arch builds on its native runner (no QEMU).
  # ---------------------------------------------------------------------------
  base:
    name: Base PHP ${{ matrix.php_version }} (${{ matrix.arch.cache_arch }})
    needs: plan
    if: ${{ needs.plan.outputs.has_base == 'true' }}
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.base) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the base and tools images
        if: ${{ !env.ACT }}
        env:
          PHP_VERSION: ${{ matrix.php_version }}
          PHP_OS_RELEASE: ${{ matrix.php_os_release }}
          PHP_SOURCE_IMAGE: ${{ needs.plan.outputs.php_source_image }}
          XDEBUG_TYPE: ${{ matrix.xdebug_type }}
          ARCH_SUFFIX: ${{ matrix.arch.cache_suffix }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          RUN_ID: ${{ github.run_id }}
          PUSH: "true"
          BASE_FINGERPRINT: ${{ matrix.fingerprint }}
          BASE_CACHE_REF: ${{ needs.plan.outputs.registry }}/php-fpm:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-buildcache
          NO_CACHE: ${{ needs.plan.outputs.no_cache }}
        run: |
          set -uo pipefail
          bake_args=(-f php-fpm/docker-bake.hcl --progress=plain)
          if [ "$NO_CACHE" = "true" ]; then bake_args+=(--no-cache); fi
          docker buildx bake "${bake_args[@]}" base-stage

  # ---------------------------------------------------------------------------
  # One job per PHP version × architecture × chunk of Node versions: the php+node
  # image and its five variants for each Node version, one bake call per Node
  # version (a failing version does not stop the next one). Builds on the base and
  # tools per-arch tags of this run, or on the reused ones when the base did not
  # change. Runs even when some base jobs failed (plain `needs:` would skip the
  # whole matrix); the script refuses a base that is not this run's or stale.
  # ---------------------------------------------------------------------------
  variants:
    name: PHP ${{ matrix.php_version }} ${{ matrix.chunk }} (${{ matrix.arch.cache_arch }})
    needs: [ plan, base ]
    if: ${{ !cancelled() && needs.plan.outputs.has_chunks == 'true' }}
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: df -h /
      - name: Build and push the variants
        if: ${{ !env.ACT }}
        env:
          PHP_VERSION: ${{ matrix.php_version }}
          PHP_OS_RELEASE: ${{ matrix.php_os_release }}
          XDEBUG_TYPE: ${{ matrix.xdebug_type }}
          ARCH_SUFFIX: ${{ matrix.arch.cache_suffix }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          RUN_ID: ${{ github.run_id }}
          PUSH: "true"
          BASE_FINGERPRINT: ${{ matrix.base_fingerprint }}
          BASE_BUILT: ${{ matrix.base_built }}
          CHUNK_NODES: ${{ matrix.nodes }}
        run: .github/scripts/bake-php-fpm-variants.sh

  # ---------------------------------------------------------------------------
  # Publish the multi-arch tags, one leg per image. Runs even when some build
  # jobs failed, so the versions that did build are still published; the merge
  # script publishes a version only when every arch tag carries this run's id and
  # keeps the previous image otherwise.
  # ---------------------------------------------------------------------------
  merge:
    name: Merge ${{ matrix.image }}
    needs: [ plan, base, variants ]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && (needs.plan.outputs.has_base == 'true' || needs.plan.outputs.has_chunks == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [ php-fpm, php-fpm-debug, php-fpm-magento1, php-fpm-magento2, php-fpm-magento2-debug, php-fpm-wordpress ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the multi-arch tags
        if: ${{ !env.ACT && fromJson(needs.plan.outputs.expected)[matrix.image] != null }}
        env:
          EXPECTED: ${{ toJson(fromJson(needs.plan.outputs.expected)[matrix.image]) }}
          IMAGE: ${{ needs.plan.outputs.registry }}/${{ matrix.image }}
          RUN_ID: ${{ github.run_id }}
        run: jq -r '.[]' <<<"$EXPECTED" | bash .github/scripts/merge-per-arch-tags.sh "$IMAGE" "$RUN_ID"
