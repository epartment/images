            image=moby/buildkit:v0.10.6
      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.arch.cache_arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          file: php-fpm/magento1/Dockerfile
          context: php-fpm/context
          platforms: ${{ matrix.arch.docker_platform }}
          build-args: |
            ENV_SOURCE_IMAGE=ghcr.io/${{ github.repository_owner }}/roll/php-fpm
            PHP_VERSION=${{ matrix.php_version }}-node${{ matrix.node_version }}
          tags: ${{ env.REGISTRY_MAGENTO1 }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-magento1:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/roll/php-fpm-magento1:${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}-buildcache,mode=max
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}

      - name: Export digest
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        run: |
          mkdir -p ${{ runner.temp }}/magento1-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/magento1-digests/${digest#sha256:}-${{ matrix.php_version }}-node${{ matrix.node_version }}"

      - name: Upload digest
        if: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: magento1-digests-${{ matrix.php_version }}-${{ matrix.arch.cache_suffix }}-node${{ matrix.node_version }}
          path: ${{ runner.temp }}/magento1-digests/*
          if-no-files-found: error
          retention-days: 1

  magento2:
    needs: [ full-matrix, php-node ]
    name: Magento 2 PHP-FPM ${{ matrix.php_version }} - Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.arch.runs_on }}
    permissions:
      contents: read
      packages: write
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
