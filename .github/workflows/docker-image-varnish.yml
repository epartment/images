name: Docker Image Varnish
on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images (ignore digest check)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 7 * * 0'
  push:
    paths:
      - .trigger
      - varnish/**
      - .github/workflows/*varnish*

jobs:
  discover-versions:
    name: Discover Varnish Versions
    runs-on: ubuntu-latest
    outputs:
      modern_matrix: ${{ steps.discover.outputs.modern_matrix }}
      build_modern: ${{ steps.discover.outputs.build_modern }}
    steps:
      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Login to GHCR (for digest check)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Discover Varnish versions
        id: discover
        run: |
          FORCE_REBUILD="${{ inputs.force_rebuild }}"
          GHCR_BASE="ghcr.io/${{ github.repository_owner }}/varnish"

          # Discover bare major.minor tags >= 7.0 (modern Alpine-based Dockerfile)
          VERSIONS=$(crane ls varnish 2>/dev/null \
            | grep -E '^[0-9]+\.[0-9]+$' \
            | awk -F'.' '$1 >= 7' \
            | sort -V)

          echo "Discovered modern Varnish versions: $VERSIONS"

          # Resolve full patch version and check digests
          ALL_TAGS=$(crane ls varnish 2>/dev/null)
          MATRIX='{"include":['
          FIRST=true
          for VERSION in $VERSIONS; do
            ESCAPED_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')

            # Resolve latest patch tag (match alpine suffix too)
            FULL_VERSION=$(echo "$ALL_TAGS" \
              | grep -E "^${ESCAPED_VERSION}(\.[0-9]+)?(\.[0-9]+)?(-alpine)?$" \
              | sort -Vr | head -n1)

            if [ -z "$FULL_VERSION" ]; then
              echo "⚠️  Varnish ${VERSION}: No matching tag found, skipping"
              continue
            fi

            echo "Varnish ${VERSION} -> ${FULL_VERSION}"

            NEEDS_BUILD=false
            if [ "$FORCE_REBUILD" = "true" ]; then
              NEEDS_BUILD=true
              echo "  🔄 Force rebuild"
            else
              UPSTREAM_DIGEST=$(crane digest "varnish:${FULL_VERSION}" 2>/dev/null || echo "")
              GHCR_DIGEST=$(crane digest "${GHCR_BASE}:${VERSION}" 2>/dev/null || echo "")

              if [ -z "$GHCR_DIGEST" ]; then
                NEEDS_BUILD=true
                echo "  🆕 Not yet on GHCR"
              elif [ -z "$UPSTREAM_DIGEST" ]; then
                echo "  ⚠️  Could not get upstream digest, skipping"
                continue
              elif [ "$UPSTREAM_DIGEST" != "$GHCR_DIGEST" ]; then
                NEEDS_BUILD=true
                echo "  🔄 Digest changed"
              else
                echo "  ✅ Up to date"
              fi
            fi

            if [ "$NEEDS_BUILD" = "true" ]; then
              [ "$FIRST" = true ] && FIRST=false || MATRIX+=','
              MATRIX+="{\"version\":\"${VERSION}\",\"full_version\":\"${FULL_VERSION}\"}"
            fi
          done
          MATRIX+=']}'

          echo "Modern matrix: $MATRIX"

          if [ "$MATRIX" = '{"include":[]}' ]; then
            echo "build_modern=false" >> $GITHUB_OUTPUT
          else
            echo "build_modern=true" >> $GITHUB_OUTPUT
          fi
          echo "modern_matrix=$MATRIX" >> $GITHUB_OUTPUT

  varnish:
    name: Varnish ${{ matrix.version }}
    needs: discover-versions
    if: needs.discover-versions.outputs.build_modern == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-versions.outputs.modern_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ !env.ACT }}

      - uses: docker/build-push-action@v6
        with:
          context: varnish
          platforms: linux/amd64,linux/arm64
          build-args: VARNISH_VERSION=${{ matrix.full_version }}
          push: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
          tags: ghcr.io/${{ github.repository_owner }}/varnish:${{ matrix.version }}
        if: ${{ !env.ACT && github.ref == 'refs/heads/master'}}

  varnish-lts:
    name: Varnish LTS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "6.0"
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ !env.ACT }}

      - name: Determine Version
        run: |-
          ESCAPED_VERSION="$(echo ${{ matrix.version }} | sed 's/\./\\\./g')"
          VARNISH_VERSION=$(
            docker run --rm gcr.io/go-containerregistry/crane:v0.20.3 ls varnish \
            | egrep "^${ESCAPED_VERSION}(\.[0-9]+)?(\.[0-9]+)?(-alpine)?$" | sort -Vr | head -n1
          )
          echo "VARNISH_VERSION=${VARNISH_VERSION}" | tee /dev/stderr >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: varnish
          file: varnish/Dockerfile.lts
          platforms: linux/amd64,linux/arm64
          build-args: VARNISH_VERSION=${{ env.VARNISH_VERSION }}
          push: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
          tags: ghcr.io/${{ github.repository_owner }}/varnish:${{ matrix.version }}
        if: ${{ !env.ACT && github.ref == 'refs/heads/master'}}

  varnish-legacy:
    name: Varnish Legacy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "6.5"
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ !env.ACT }}

      - name: Configure RPM repository
        run: echo "VARNISH_VERSION=$(echo ${{ matrix.version }} | tr -d .)" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: varnish
          file: varnish/Dockerfile.legacy
          platforms: linux/amd64, linux/arm64
          build-args: VARNISH_VERSION=${{ env.VARNISH_VERSION }}
          push: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
          tags: ghcr.io/${{ github.repository_owner }}/varnish:${{ matrix.version }}
        if: ${{ !env.ACT && github.ref == 'refs/heads/master'}}
